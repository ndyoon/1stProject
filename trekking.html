<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>트레킹 | ND Yoon</title>

  <style>
    :root {
      --bg-color: #f5f5f5;
      --text-color: #222222;
      --link-color: #555555;
      --btn-bg: #eeeeee;
      --btn-text: #222222;
      --btn-hover-bg: #222222;
      --btn-hover-text: #ffffff;
      --border-color: #dddddd;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --link-color: #aaaaaa;
      --btn-bg: #2c2c2c;
      --btn-text: #e0e0e0;
      --btn-hover-bg: #ffffff;
      --btn-hover-text: #121212;
      --border-color: #333333;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 60px auto;
      padding: 20px;
      background: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    a.back-btn {
      display: inline-block;
      text-decoration: none;
      color: var(--btn-text);
      background: var(--btn-bg);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    a.back-btn:hover {
      background: var(--btn-hover-bg);
      color: var(--btn-hover-text);
    }

    .theme-toggle-btn {
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .theme-toggle-btn:hover {
      background: var(--btn-hover-bg);
      color: var(--btn-hover-text);
    }

    h1 {
      font-size: 40px;
    }
  </style>
  <script src="theme.js" defer></script>
</head>

<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">← Home</a>
    <button id="theme-toggle-btn" class="theme-toggle-btn" type="button">🌙 다크 모드</button>
  </div>

  <h1>트레킹</h1>

  <p>
    나의 트레킹 계획과 여행 기록을 관리하는 공간입니다.
  </p>

  <h2>나의 트레킹 프로젝트</h2>

  <ul>
    <li>제주 올레길</li>
    <li>지리산 둘레길</li>
    <li>코리아둘레길</li>
  </ul>

</body>
</html>
